[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "httpx2>=0.1",
]

[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
pythonpath = ["."]
